spring.application.name=rabbitmq-demo
server.port=${PORT:8090}

# RabbitMQ
spring.rabbitmq.addresses=${CLOUDAMQP_URL}
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.prefetch=1

# Send rejected messages to the dead-letter exchange
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Database settings (demo only)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0


# RabbitMQ listener retry configuration
spring.rabbitmq.listener.simple.retry.enabled=true

# Two retries after the initial attempt = 3 total attempts
spring.rabbitmq.listener.simple.retry.max-retries=2

# Wait 1 second between attempts
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=1
spring.rabbitmq.listener.simple.retry.max-interval=1s
